<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Role | EventSphere</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .role-container {
            width: min(900px, 92%);
            margin: 60px auto;
            text-align: center;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .role-card {
            padding: 28px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .role-card:hover {
            transform: translateY(-3px);
            border-color: #64748b;
        }

        .role-card.selected {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .role-card h2 {
            margin: 10px 0;
        }

        .role-icon {
            font-size: 36px;
        }

        .role-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .role-actions button {
            min-width: 150px;
            padding: 12px 22px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .role-actions button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #roleMessage {
            min-height: 24px;
            margin: 16px 0;
        }
    </style>
</head>
<body class="auth-page">

<header class="navbar">
    <a class="brand" href="../index.html">Event<span>Sphere</span></a>
    <a class="nav-link" href="../index.html">Home</a>
</header>

<main class="role-container">
    <p class="eyebrow">WELCOME TO EVENTSPHERE</p>
    <h1>Who are you?</h1>
    <p class="subtitle">Choose your role to continue.</p>

    <div class="role-grid">
        <button type="button" class="role-card"
                data-role="user" aria-pressed="false">
            <span class="role-icon">👤</span>
            <h2>User</h2>
            <p>Discover events and manage registrations.</p>
        </button>

        <button type="button" class="role-card"
                data-role="organizer" aria-pressed="false">
            <span class="role-icon">🎟️</span>
            <h2>Organizer</h2>
            <p>Sign in to manage your events.</p>
        </button>

        <button type="button" class="role-card"
                data-role="admin" aria-pressed="false">
            <span class="role-icon">🛡️</span>
            <h2>Admin</h2>
            <p>Sign in to access administration.</p>
        </button>
    </div>

    <p id="roleMessage" role="status" aria-live="polite"></p>

    <div class="role-actions">
        <button type="button" id="loginButton" disabled>
            Login
        </button>
        <button type="button" id="registerButton" disabled>
            Register
        </button>
    </div>

    <p class="back-link">
        <a href="../index.html">← Back to home</a>
    </p>
</main>

<script src="../js/role-selection.js"></script>
</body>
</html>
