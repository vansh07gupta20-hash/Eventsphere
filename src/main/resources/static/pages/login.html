<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EventSphere</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/eventsphere-user-login.css">
</head>

<body class="auth-page user-login-page">

<header class="navbar">
    <a class="brand" href="../index.html">
        Event<span>Sphere</span>
    </a>

    <a class="nav-link" href="../index.html">Home</a>
</header>

<main class="auth-container login-page">
    <section class="auth-card">

        <div class="auth-icon">✦</div>

        <p class="eyebrow">WELCOME BACK</p>

        <h1>Sign in to your account</h1>

        <p class="subtitle">
            Enter your details to continue your event journey.
        </p>

        <div id="message" class="message" role="alert" hidden></div>

        <form id="loginForm">

            <label for="email">Email address</label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
            >

            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
            >

            <div class="form-options">
                <a href="#" id="forgotPasswordLink">
                    Forgot password?
                </a>
            </div>

            <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
            >
                Sign In
            </button>

        </form>

        <p class="register-login-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <p class="back-link">
            <a href="../index.html">← Back to home</a>
        </p>

    </section>
</main>

<footer class="footer">
    EventSphere · Event Management System
</footer>

<script src="../js/login.js"></script>

</body>
</html>
