<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | EventSphere</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/eventsphere-forgot-password.css">
</head>

<body class="forgot-password-page">

<header>
    <nav>
        <a href="../index.html" class="logo">
            EventSphere<span>.</span>
        </a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
</header>

<main class="container">
    <section class="forgot-container">

        <div class="forgot-icon">✦</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            No worries! Enter your registered email address
            and we'll help you reset your password.
        </p>

        <div
                id="forgotMessage"
                class="message"
                role="status"
                aria-live="polite"
                hidden>
        </div>

        <form id="forgotPasswordForm">

            <label for="userEmail">Email Address</label>

            <input
                    type="email"
                    id="userEmail"
                    name="userEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            <button type="submit" id="resetButton">
                Send Reset Link <span>→</span>
            </button>

        </form>

        <p class="back-login">
            Remember your password?
            <a href="login.html">Login here</a>
        </p>

        <div class="forgot-footer">
            ✧ Your next experience starts here
        </div>

    </section>
</main>

<script src="../js/forgot-password.js"></script>

</body>
</html>
