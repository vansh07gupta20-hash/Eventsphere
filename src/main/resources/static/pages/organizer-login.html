
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Login | EventSphere</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a class="brand" href="../index.html">
        Event<span>Sphere</span>
    </a>
    <a class="nav-link" href="role-selection.html">Change Role</a>
</header>

<main class="auth-container">
    <section class="auth-card">
        <p class="eyebrow">ORGANIZER PORTAL</p>
        <h1>Organizer Sign In</h1>
        <p class="subtitle">Sign in to manage your events.</p>

        <div id="message" class="message" role="alert" hidden></div>

        <form id="organizerLoginForm">
            <label for="email">Organizer Email</label>
            <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    required
            >

            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
            >

            <div class="forgot-password-link">
                <a href="organizer-forgot-password.html">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" id="loginButton" class="primary-button">
                Sign In
            </button>
        </form>
    </section>
</main>

<script src="../js/organizer-login.js"></script>
</body>
</html>
