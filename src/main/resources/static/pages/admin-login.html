<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EventSphere</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
<header class="navbar">
    <a class="brand" href="../index.html">Event<span>Sphere</span></a>
    <a class="nav-link" href="role-selection.html">Change Role</a>
</header>

<main class="auth-container">
    <section class="auth-card">
        <p class="eyebrow">ADMIN PORTAL</p>
        <h1>Admin Sign In</h1>
        <p class="subtitle">Sign in with your administrator account.</p>

        <div id="message" class="message" role="alert" hidden></div>

        <form id="adminLoginForm">
            <label for="email">Admin Email</label>
            <input type="email" id="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   autocomplete="current-password" required>

            <button type="submit" id="loginButton" class="primary-button">
                Sign In
            </button>
        </form>
    </section>
</main>

<script src="../js/admin-login.js"></script>
</body>
</html>
