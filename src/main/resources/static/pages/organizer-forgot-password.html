
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EventSphere</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a class="brand" href="../index.html">
        Event<span>Sphere</span>
    </a>
    <a class="nav-link" href="organizer-login.html">Login</a>
</header>

<main class="auth-container">
    <section class="auth-card">
        <h1>Forgot Password?</h1>
        <p class="subtitle">
            Enter your registered organizer email to receive a password reset link.
        </p>

        <div id="forgotMessage" class="message" role="alert" hidden></div>

        <form id="forgotPasswordForm">
            <label for="organizerEmail">Organizer Email</label>
            <input
                    type="email"
                    id="organizerEmail"
                    placeholder="Enter your registered email"
                    required
            >

            <button type="submit" id="forgotButton" class="primary-button">
                Send Reset Link
            </button>
        </form>

        <p class="back-link">
            <a href="organizer-login.html">Back to Login</a>
        </p>
    </section>
</main>

<script src="../js/organizer-forgot-password.js"></script>

</body>
</html>
