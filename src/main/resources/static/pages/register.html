<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EventSphere</title>

    <!-- Existing Global CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Creative Register Page CSS -->
    <link rel="stylesheet" href="../css/eventsphere-user-register.css">
</head>

<body class="user-register-page">

<header>
    <nav>
        <a href="../index.html" class="logo">EventSphere<span>.</span></a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
</header>

<main class="container">
    <section class="form-container">

        <div class="register-icon">
            ✦
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join EventSphere and discover exciting events.
        </p>

        <!-- Registration Message -->
        <div
                id="registerMessage"
                class="message"
                role="status"
                aria-live="polite"
                hidden>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">

            <label for="userName">Full Name</label>
            <input
                    type="text"
                    id="userName"
                    name="userName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="100"
                    required
            >

            <label for="userEmail">Email Address</label>
            <input
                    type="email"
                    id="userEmail"
                    name="userEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
            >

            <label for="userPhoneNumber">Mobile Number</label>
            <input
                    type="tel"
                    id="userPhoneNumber"
                    name="userPhoneNumber"
                    placeholder="10-digit Indian mobile number"
                    autocomplete="tel"
                    inputmode="numeric"
                    pattern="[6-9][0-9]{9}"
                    title="Enter a valid 10-digit Indian mobile number"
                    maxlength="10"
                    required
            >

            <label for="userPassword">Password</label>
            <input
                    type="password"
                    id="userPassword"
                    name="userPassword"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >

            <button type="submit" id="registerButton">
                Create Account <span>→</span>
            </button>

        </form>

        <p class="register-login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <div class="register-footer">
            ✧ Your next experience starts here
        </div>

    </section>
</main>

<script src="../js/register.js"></script>

</body>
</html>
