<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Reset Password | EventSphere</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<header class="navbar">
  <a class="brand" href="../index.html">
    Event<span>Sphere</span>
  </a>
  <a class="nav-link" href="login.html">Login</a>
</header>

<main class="auth-container">
  <section class="auth-card">

    <div class="auth-icon">✦</div>

    <p class="eyebrow">SECURE YOUR ACCOUNT</p>

    <h1>Reset Password</h1>

    <p class="subtitle">
      Enter your new password below.
    </p>

    <div id="resetMessage" class="message" role="alert" hidden></div>

    <form id="resetPasswordForm">

      <label for="newPassword">New Password</label>
      <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required
      >

      <button type="submit" id="resetPasswordButton" class="primary-button">
        Reset Password
      </button>

    </form>

    <p class="back-link">
      <a href="login.html">Back to Login</a>
    </p>

  </section>
</main>

<script src="../js/reset-password.js"></script>

</body>
</html>
